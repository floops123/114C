<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
  <title>C411 Music</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-2-2.83V5.5l12-2.5v12.5a3 3 0 1 1-2-2.83V7.6L9 9.3v9.2Z"/></svg></span><span class="brand-name">C411 Music</span></a>
    <nav class="nav">
      <a href="#" data-view="home">Accueil</a>
      <a href="#albums" data-view="albums">Albums</a>
      <a href="#artists" data-view="artists">Artistes</a>
      <a href="#audiobooks" data-view="audiobooks">Livres audio</a>
      <a href="#favoris" data-view="favoris" data-favorites-only hidden>Favoris</a>
    </nav>
    <button class="random" id="random" title="Lancer une playlist au hasard (dans le genre affiché, s'il y en a un)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v14h14V5H5Zm2.5 1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM7.5 15a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/></svg>
      <span>Random</span>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="search" type="search" placeholder="Album, artiste, titre…" autocomplete="off">
    </label>
    <button class="scan" id="scan" title="État de la discothèque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 10h2v7h-2zm0-3h2v2h-2zm1-5a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/></svg>
      <span id="scan-label"></span>
    </button>
  </header>

  <main id="main">
    <div id="content"></div>
    <p class="status" id="status">Chargement de la discothèque…</p>
    <footer class="made">made with <span class="coeur" aria-label="amour">♥</span></footer>
  </main>

  <aside class="queue" id="queue" hidden aria-label="File d'attente">
    <header><strong>File d'attente</strong><button class="link-btn" id="queue-current" title="Ouvrir l'album du titre en cours">titre en cours</button><button class="icon-btn" id="queue-close" title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="m18.3 7.1-1.4-1.4L12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg></button></header>
    <ol id="queue-list"></ol>
  </aside>

  <footer class="player" id="player" hidden>
    <audio id="audio" preload="auto"></audio>
    <div class="now">
      <button class="now-cover" id="now-cover" title="Voir l'album"></button>
      <div class="now-text"><strong id="now-title"></strong><a href="#" id="now-artist"></a></div>
      <span id="now-fav"></span>
    </div>
    <div class="transport">
      <div class="buttons">
        <button class="icon-btn toggle" id="shuffle" title="Aléatoire (S)"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1L14.5 20H20v-5.5l-2 2-3.2-3.1Z"/></svg></button>
        <button class="icon-btn" id="prev" title="Précédent (P)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="play-btn" id="play" title="Lecture / pause (Espace)"></button>
        <button class="icon-btn" id="next" title="Suivant (N)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="icon-btn toggle" id="repeat" title="Répéter (R)"></button>
      </div>
      <div class="timeline">
        <span class="time" id="elapsed">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
        <span class="time" id="total">0:00</span>
      </div>
    </div>
    <div class="extras">
      <span class="spinner" id="spinner" hidden></span>
      <button class="icon-btn" id="mute" title="Couper le son (M)"></button>
      <input type="range" id="volume" min="0" max="100" value="100" aria-label="Volume">
      <button class="icon-btn" id="queue-btn" title="File d'attente (Q)"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v6.2a3 3 0 1 0 2 2.8V12h3v-2h-5Z"/></svg></button>
    </div>
  </footer>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
