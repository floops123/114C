<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
  <title>C411 Books</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h6a2.5 2.5 0 0 1 2.5 2.5v13A2 2 0 0 0 10.5 18H4Zm16 0h-6A2.5 2.5 0 0 0 11.5 7v13a2 2 0 0 1 2-2H20Z"/></svg></span><span class="brand-name">C411 Books</span></a>
    <nav class="nav">
      <a href="#" data-view="home">Accueil</a>
      <a href="#book" data-view="book">Livres</a>
      <a href="#comic" data-view="comic">BD</a>
      <a href="#manga" data-view="manga">Mangas</a>
      <a href="#magazine" data-view="magazine">Magazines</a>
      <a href="#favoris" data-view="favoris" data-favorites-only hidden>Favoris</a>
    </nav>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="search" type="search" placeholder="Titre, auteur, série…" autocomplete="off">
    </label>
    <button class="state" id="state" title="État de la bibliothèque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 10h2v7h-2zm0-3h2v2h-2zm1-5a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/></svg>
      <span id="state-label"></span>
    </button>
  </header>

  <main id="main">
    <div id="content"></div>
    <p class="status" id="status">Chargement de la bibliothèque…</p>
    <footer class="made">made with <span class="coeur" aria-label="amour">♥</span></footer>
  </main>

  <div class="reader" id="reader" hidden>
    <header class="reader-bar">
      <button class="icon-btn" id="reader-close" title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg></button>
      <div class="reader-title"><strong id="reader-title"></strong><span id="reader-sub"></span></div>
      <div class="reader-tools" id="reader-tools"></div>
    </header>
    <div class="reader-stage" id="reader-stage"></div>
    <footer class="reader-foot">
      <button class="icon-btn" id="reader-prev" title="Précédente (←)"><svg viewBox="0 0 24 24"><path d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg></button>
      <input type="range" id="reader-seek" min="0" max="1000" value="0" aria-label="Position">
      <span class="reader-pos" id="reader-pos"></span>
      <button class="icon-btn" id="reader-next" title="Suivante (→)"><svg viewBox="0 0 24 24"><path d="m8.6 6.4 1.4-1.4 7 7-7 7-1.4-1.4 5.6-5.6z"/></svg></button>
    </footer>
    <div class="reader-spinner" id="reader-spinner"><span class="spinner"></span></div>
    <p class="reader-error" id="reader-error" hidden></p>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
