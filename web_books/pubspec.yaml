name: c411_web_books
description: "Bibliothèque web des livres, BD, mangas et magazines du serveur de C411 Remote."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5

# Serveur HTTP de dart:io. Le client FTP, le relais HTTP et la lecture des
# noms sont ceux de l'application (paquet partagé c411_core) ; xml pour les
# métadonnées des EPUB et des BD (ComicInfo.xml).
dependencies:
  c411_core:
    path: ../packages/c411_core
  xml: ^6.6.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
