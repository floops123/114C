<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07141a">
  <title>C411 TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#" data-view="home"><span class="logo">411</span><span class="brand-name">C411 TV</span></a>
    <nav class="nav">
      <a href="#" data-view="home" class="active">Accueil</a>
      <a href="#" data-view="movie">Films</a>
      <a href="#" data-view="tv">Séries</a>
    </nav>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="search" type="search" placeholder="Titre, série…" autocomplete="off">
    </label>
  </header>

  <main id="main">
    <section class="hero" id="hero" hidden></section>
    <div id="content"></div>
    <p class="status" id="status">Chargement de la vidéothèque…</p>
  </main>

  <div class="modal" id="detail" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title"></article>
  </div>

  <div class="player" id="player" hidden>
    <video id="video" playsinline preload="auto"></video>
    <div class="player-top">
      <button class="icon-btn" id="player-back" title="Retour (Échap)">
        <svg viewBox="0 0 24 24"><path d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg>
      </button>
      <div class="player-title"><strong id="player-title"></strong><span id="player-sub"></span></div>
    </div>
    <div class="player-center" id="player-spinner"><span class="spinner"></span></div>
    <p class="player-error" id="player-error" hidden></p>
    <div class="player-bottom">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="controls">
        <button class="icon-btn" id="play" title="Lecture / pause (Espace)"></button>
        <button class="icon-btn" id="back10" title="Reculer de 10 s (←)">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/><text x="12" y="16" text-anchor="middle" font-size="6.5" font-weight="700">10</text></svg>
        </button>
        <button class="icon-btn" id="fwd10" title="Avancer de 10 s (→)">
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8Z"/><text x="12" y="16" text-anchor="middle" font-size="6.5" font-weight="700">10</text></svg>
        </button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="pill" id="next-episode" hidden>Épisode suivant ›</button>
        <select id="audio" title="Piste audio" hidden></select>
        <button class="icon-btn" id="fullscreen" title="Plein écran (F)">
          <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5Zm9 0h5v5h-2V7h-3V5ZM5 14h2v3h3v2H5v-5Zm12 0h2v5h-5v-2h3v-3Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
