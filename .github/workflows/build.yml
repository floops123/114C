# Compilation de C411 Remote : tests, puis APK Android, Linux et Windows.
# Les binaires sont attachés à chaque exécution (onglet Actions › Artifacts).
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version figée, celle utilisée en local. Le projet requiert Dart ^3.13.5
  # (Flutter >= 3.47.0).
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Serveurs web (Dart pur) : C411 TV, C411 Music, C411 Books. Le test de
      # bout en bout de C411 TV avec ffmpeg est ignoré si ffmpeg est absent.
      - name: Serveurs web
        run: |
          for project in web_player web_music web_books; do
            echo "::group::$project"
            (cd "$project" && dart pub get && dart analyze && dart test)
            echo "::endgroup::"
          done

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Signé avec la clé de débogage (android/app/build.gradle.kts).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: c411_remote-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  linux:
    name: Linux
    needs: test
    # Version fixe : l'AppImage exige au moins la glibc de cette image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # GTK pour Flutter, libmpv pour le lecteur (media_kit), libsecret pour
      # le trousseau (flutter_secure_storage), jsoncpp pour ce dernier.
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libmpv-dev mpv libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Archive
        run: tar -czf c411_remote-linux-x64.tar.gz -C build/linux/x64/release bundle
      # Un seul fichier exécutable, libmpv comprise (voir le script) :
      # AppImage et AppBundle (pelf).
      - name: AppImage et AppBundle
        run: tool/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: c411_remote-linux-${{ github.sha }}
          path: |
            c411_remote-linux-x64.tar.gz
            build/appimage/C411_Remote-x86_64.AppImage
            build/appimage/C411_Remote-x86_64.dwfs.AppBundle
          retention-days: 14

  windows:
    name: Windows
    # Désactivé pour le moment ; retirer cette ligne pour le réactiver.
    if: false
    needs: test
    runs-on: windows-latest
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      # flutter_secure_storage_windows a besoin d'ATL (atlstr.h) : ajouté à
      # Visual Studio s'il manque.
      - name: Composant ATL de Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -products * -latest -property installationPath
          $atl = & $vswhere -products * -latest -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if ($atl) {
            Write-Host "ATL déjà présent : $atl"
          } else {
            Write-Host "ATL absent : installation…"
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
              "modify --installPath `"$install`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache"
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit 1 }
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      # Runtime Visual C++ à côté de l'exécutable (déploiement local
      # autorisé par Microsoft) : rien à installer en plus sur un Windows
      # neuf.
      - name: Runtime Visual C++
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath c411_remote-windows-x64.zip
      # Un seul fichier : l'installateur (Inno Setup), version de pubspec.yaml.
      - name: Installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows\packaging\c411_remote.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: c411_remote-windows-${{ github.sha }}
          path: |
            c411_remote-windows-x64.zip
            build/installer/C411_Remote-Setup-x64.exe
          retention-days: 14
