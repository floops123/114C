image: ghcr.io/cirruslabs/flutter:stable

stages:
  - prepare
  - build

variables:
  # Tag Flutter a installer, fige pour des builds reproductibles (celui
  # utilise en local). Le projet requiert Dart ^3.13.5 (Flutter >= 3.47.0).
  FLUTTER_REF: "3.47.7"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
      - .gradle/caches/
      - .gradle/wrapper/

# L'image embarque un Flutter plus ancien (Dart 3.12) dont le depot git est
# incomplet : on clone une version recente de Flutter et on la place en tete du PATH.
.flutter_setup:
  before_script:
    - git config --global --add safe.directory '*'
    - git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$CI_PROJECT_DIR/.flutter-sdk"
    - export PATH="$CI_PROJECT_DIR/.flutter-sdk/bin:$PATH"
    - flutter --version

analyze:
  stage: prepare
  extends: .flutter_setup
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test
    # C411 TV (web_player) : Dart pur. Le test de bout en bout avec ffmpeg
    # est ignoré si ffmpeg n'est pas installé dans l'image.
    - cd web_player && dart pub get && dart analyze && dart test

build_android_apk:
  stage: build
  extends: .flutter_setup
  script:
    - flutter pub get
    - flutter build apk --release
  artifacts:
    name: "c411_remote-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 2 weeks

build_linux:
  stage: build
  before_script:
    - !reference [.flutter_setup, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get
    - flutter build linux --release
  artifacts:
    name: "c411_remote-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 2 weeks
