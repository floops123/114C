image: ghcr.io/cirruslabs/flutter:stable

stages:
  - prepare
  - build

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
      - .gradle/caches/
      - .gradle/wrapper/

# L'image Flutter peut avoir du retard sur la derniere version stable.
# Le projet requiert Dart ^3.13.5 (Flutter >= 3.47.0) : on met Flutter a jour.
.flutter_setup:
  before_script:
    - git config --global --add safe.directory '*'
    - flutter channel stable
    - flutter upgrade --force
    - flutter --version

analyze:
  stage: prepare
  extends: .flutter_setup
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test
  allow_failure: true

build_android_apk:
  stage: build
  extends: .flutter_setup
  script:
    - flutter pub get
    - flutter build apk --release
  artifacts:
    name: "c411_remote-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 2 weeks

build_linux:
  stage: build
  before_script:
    - !reference [.flutter_setup, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get
    - flutter build linux --release
  artifacts:
    name: "c411_remote-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 2 weeks
